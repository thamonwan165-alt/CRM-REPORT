              {copied ? '✅ คัดลอกสรุปแล้ว!' : '📋 คัดลอกสรุปส่ง LINE / ประชุม'}
            </button>
          </header>

          {/* Navigation Tabs */}
          <div className="flex border-b border-slate-200 gap-2 overflow-x-auto text-sm font-bold">
            <button
              onClick={() => setTab('overview')}
              className={`py-3 px-4 border-b-2 transition-all ${tab === 'overview' ? 'border-amber-500 text-amber-600' : 'border-transparent text-slate-500 hover:text-slate-800'}`}
            >
              📊 สรุปภาพรวมผู้บริหาร (Overview)
            </button>
            <button
              onClick={() => setTab('cases')}
              className={`py-3 px-4 border-b-2 transition-all ${tab === 'cases' ? 'border-amber-500 text-amber-600' : 'border-transparent text-slate-500 hover:text-slate-800'}`}
            >
              🔍 รายละเอียด 29 เคสแยกบุคคล (Case Directory)
            </button>
            <button
              onClick={() => setTab('scripts')}
              className={`py-3 px-4 border-b-2 transition-all ${tab === 'scripts' ? 'border-amber-500 text-amber-600' : 'border-transparent text-slate-500 hover:text-slate-800'}`}
            >
              💬 คลังสคริปต์เปรียบเทียบ (Script Library)
            </button>
            <button
              onClick={() => setTab('plan')}
              className={`py-3 px-4 border-b-2 transition-all ${tab === 'plan' ? 'border-amber-500 text-amber-600' : 'border-transparent text-slate-500 hover:text-slate-800'}`}
            >
              🎯 แผนปฏิบัติการ Supervisor (Action Plan)
            </button>
          </div>

          {/* TAB 1: OVERVIEW */}
          {tab === 'overview' && (
            <div className="space-y-6">
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                {/* Card 1 PTE */}
                <div className="bg-white p-5 rounded-xl border border-rose-200 shadow-xs">
                  <div className="flex justify-between items-center mb-2">
                    <span className="bg-rose-50 text-rose-700 border border-rose-200 text-xs font-bold px-2.5 py-0.5 rounded-full">สาขา PTE (ปทุมธานี)</span>
                    <span className="text-xs font-bold text-rose-600">🚨 เสี่ยง 9.4/10</span>
                  </div>
                  <h3 className="font-bold text-slate-900 text-base">พบปัญหา 8 คน</h3>
                  <p className="text-xs text-slate-500 mt-1">ประเด็นวิกฤต/เสี่ยงข้อกฎหมาย</p>
                  <ul className="text-xs text-slate-700 mt-3 space-y-1.5">
                    <li className="flex items-start gap-1.5"><span className="text-rose-500 font-bold">•</span> เคลมสโตรกลุกเดินได้ (กิ่งพฤกษา)</li>
                    <li className="flex items-start gap-1.5"><span className="text-rose-500 font-bold">•</span> ฝืนขายตอนลูกค้าติดงาน (ธนาภรณ์)</li>
                    <li className="flex items-start gap-1.5"><span className="text-rose-500 font-bold">•</span> พูดลดความน่าเชื่อถือตนเอง (กนกวรรณ)</li>
                  </ul>
                  <button onClick={() => { setTeamFilter('PTE'); setTab('cases'); }} className="mt-4 text-xs text-amber-600 font-bold hover:underline">
                    ดูเคสทั้งหมด 8 คน →
                  </button>
                </div>

                {/* Card 2 BKK T1 */}
                <div className="bg-white p-5 rounded-xl border border-amber-200 shadow-xs">
                  <div className="flex justify-between items-center mb-2">
                    <span className="bg-amber-50 text-amber-800 border border-amber-200 text-xs font-bold px-2.5 py-0.5 rounded-full">BKK ทีม 1 (กรุงเทพฯ)</span>
                    <span className="text-xs font-bold text-amber-600">⚠️ เสี่ยง 8.8/10</span>
                  </div>
                  <h3 className="font-bold text-slate-900 text-base">พบปัญหา 8 เคส (6 คน)</h3>
                  <p className="text-xs text-slate-500 mt-1">ระบบ/ของปลอม/ก๊อปปี้โน้ต</p>
                  <ul className="text-xs text-slate-700 mt-3 space-y-1.5">
                    <li className="flex items-start gap-1.5"><span className="text-amber-500 font-bold">•</span> ก๊อปปี้โน้ตเดิมมาใส่ซ้ำ (นริศรา)</li>
                    <li className="flex items-start gap-1.5"><span className="text-amber-500 font-bold">•</span> ตอบเรื่องของปลอมผิดร้ายแรง (ศศิประภา)</li>
                    <li className="flex items-start gap-1.5"><span className="text-amber-500 font-bold">•</span> พูดประชดลูกค้าว่าสั่งคนอื่น (วรรณา)</li>
                  </ul>
                  <button onClick={() => { setTeamFilter('BKK'); setTab('cases'); }} className="mt-4 text-xs text-amber-600 font-bold hover:underline">
                    ดูเคสทั้งหมดใน BKK →
                  </button>
                </div>

                {/* Card 3 BKK T2 */}
                <div className="bg-white p-5 rounded-xl border border-orange-200 shadow-xs">
                  <div className="flex justify-between items-center mb-2">
                    <span className="bg-orange-50 text-orange-800 border border-orange-200 text-xs font-bold px-2.5 py-0.5 rounded-full">BKK ทีม 2 (กรุงเทพฯ)</span>
                    <span className="text-xs font-bold text-orange-600">⚠️ เสี่ยง 7.9/10</span>
                  </div>
                  <h3 className="font-bold text-slate-900 text-base">พบปัญหา 7 คน</h3>
                  <p className="text-xs text-slate-500 mt-1">เทคนิคการขาย & Checklist</p>
                  <ul className="text-xs text-slate-700 mt-3 space-y-1.5">
                    <li className="flex items-start gap-1.5"><span className="text-orange-500 font-bold">•</span> ยอมถอยเร็วเมื่อลูกค้าบอกแพง (นริศรา)</li>
                    <li className="flex items-start gap-1.5"><span className="text-orange-500 font-bold">•</span> พูดแทรกลูกค้า & ไม่ทวนที่อยู่ (ศศิประภา)</li>
                    <li className="flex items-start gap-1.5"><span className="text-orange-500 font-bold">•</span> ขาด Checklist นัด 7-14 วัน (สมฤทัย)</li>
                  </ul>
                  <button onClick={() => { setTeamFilter('BKK'); setTab('cases'); }} className="mt-4 text-xs text-amber-600 font-bold hover:underline">
                    ดูเคสทั้งหมดใน BKK →
                  </button>
                </div>

                {/* Card 4 PHS */}
                <div className="bg-white p-5 rounded-xl border border-sky-200 shadow-xs">
                  <div className="flex justify-between items-center mb-2">
                    <span className="bg-sky-50 text-sky-800 border border-sky-200 text-xs font-bold px-2.5 py-0.5 rounded-full">สาขา PHS (พิษณุโลก)</span>
                    <span className="text-xs font-bold text-sky-600">📋 ปานกลาง 5.8/10</span>
                  </div>
                  <h3 className="font-bold text-slate-900 text-base">พบปัญหา 6 คน</h3>
                  <p className="text-xs text-slate-500 mt-1">การลงประวัติ & ติดตามพัสดุ</p>
                  <ul className="text-xs text-slate-700 mt-3 space-y-1.5">
                    <li className="flex items-start gap-1.5"><span className="text-sky-500 font-bold">•</span> 50% ไม่ลงประวัติสุขภาพในโน้ต</li>
                    <li className="flex items-start gap-1.5"><span className="text-sky-500 font-bold">•</span> ไม่แจ้งวันติดตามพัสดุ 2-3 วัน</li>
                    <li className="flex items-start gap-1.5"><span className="text-sky-500 font-bold">•</span> Tasks ไม่ใส่เวลาที่แน่นอน (จีรนันท์)</li>
                  </ul>
                  <button onClick={() => { setTeamFilter('PHS'); setTab('cases'); }} className="mt-4 text-xs text-amber-600 font-bold hover:underline">
                    ดูเคสทั้งหมด 6 คน →
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* TAB 2: CASES TABLE */}
          {tab === 'cases' && (
            <div className="space-y-4">
              <div className="bg-white p-4 rounded-xl border border-slate-200 flex flex-wrap items-center justify-between gap-3 text-xs">
                <div className="flex items-center gap-2">
                  <span className="font-bold text-slate-600">กรองตามสาขา:</span>
                  <select
                    value={teamFilter}
                    onChange={e => setTeamFilter(e.target.value)}
                    className="border border-slate-200 rounded-lg px-2.5 py-1.5 bg-white font-medium"
                  >
                    <option value="ALL">ทั้งหมด (29 เคส)</option>
                    <option value="PHS">สาขา PHS (6 เคส)</option>
                    <option value="PTE">สาขา PTE (8 เคส)</option>
                    <option value="BKK">สาขา BKK (15 เคส)</option>
                  </select>
                </div>

                <div className="flex-1 max-w-sm">
                  <input
                    type="text"
                    placeholder="พิมพ์ค้นหาชื่อพนักงาน หรือประเด็นปัญหา..."
                    value={search}
                    onChange={e => setSearch(e.target.value)}
                    className="w-full border border-slate-200 rounded-lg px-3 py-1.5 bg-slate-50"
                  />
                </div>
                <div className="text-slate-500">
                  แสดง <strong>{filteredCases.length}</strong> จาก 29 เคส
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                {filteredCases.map((c, i) => (
                  <div key={c.id} className="bg-white p-4 rounded-xl border border-slate-200 shadow-2xs space-y-2">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <span className="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center font-bold text-xs text-slate-600">{i+1}</span>
                        <h4 className="font-bold text-slate-900 text-sm">{c.name}</h4>
                        <span className="text-[11px] px-2 py-0.5 rounded bg-slate-100 font-medium text-slate-600">{c.team}</span>
                      </div>
                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${
                        c.sev === 'critical' ? 'bg-rose-100 text-rose-800' :
                        c.sev === 'high' ? 'bg-amber-100 text-amber-800' : 'bg-sky-100 text-sky-800'
                      }`}>
                        {c.sev === 'critical' ? '🚨 วิกฤต' : c.sev === 'high' ? '⚠️ เสี่ยงสูง' : '📋 ปานกลาง'}
                      </span>
                    </div>

                    <div className="bg-slate-50 p-2.5 rounded-lg border border-slate-100 space-y-1">
                      {c.issues.map((issue, idx) => (
                        <p key={idx} className="text-xs text-slate-700 flex items-start gap-1.5">
                          <span className="text-rose-500 font-bold">•</span>
                          <span>{issue}</span>
                        </p>
                      ))}
                    </div>

                    <div className="text-[11px] text-slate-500 bg-amber-50/60 p-2 rounded border border-amber-100">
                      <strong className="text-amber-900">คำสั่งการ SUP:</strong> {c.act}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* TAB 3: SCRIPTS */}
          {tab === 'scripts' && (
            <div className="space-y-4">
              {SCRIPTS.map((s, idx) => (
                <div key={idx} className="bg-white p-5 rounded-xl border border-slate-200 shadow-xs space-y-3">
                  <div className="font-bold text-slate-800 text-sm flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-amber-500"></span>
                    {s.context}
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                    <div className="bg-rose-50 p-3 rounded-lg border border-rose-200 text-rose-950">
                      <div className="font-bold text-rose-800 mb-1">❌ คำพูดเดิมที่ไม่แนะนำ:</div>
                      <p className="italic">"{s.bad}"</p>
                    </div>
                    <div className="bg-emerald-50 p-3 rounded-lg border border-emerald-200 text-emerald-950">
                      <div className="font-bold text-emerald-800 mb-1">✅ คำพูดปรับปรุงแนะนำโดย QA:</div>
                      <p className="font-medium">"{s.good}"</p>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* TAB 4: ACTION PLAN */}
          {tab === 'plan' && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-xs space-y-2">
                <h3 className="font-bold text-rose-700 text-sm">1. กฎเหล็ก: ห้ามเคลมโรคสโตรก/อัมพาต & ห้ามฝืนขาย</h3>
                <p className="text-xs text-slate-600 leading-relaxed">
                  เด็ดขาดสำหรับสาขา PTE ห้ามเคลมอาหารเสริมว่ารักษาอัมพาตเดินได้ เสี่ยงต่อการถูกดำเนินคดีจาก อย. หากลูกค้าติดธุระต้องวางสายทันที
                </p>
              </div>

              <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-xs space-y-2">
                <h3 className="font-bold text-amber-700 text-sm">2. บังคับใช้ Checklist 4 ข้อหลังการขาย 100%</h3>
                <p className="text-xs text-slate-600 leading-relaxed">
                  (1) ฝากชื่อดูแล (2) นัดติดตาม 7-14 วัน (3) แจ้งติดตามพัสดุ 2-3 วัน (4) ทวนที่อยู่จัดส่ง ป้องกันสินค้าตีกลับ
                </p>
              </div>

              <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-xs space-y-2">
                <h3 className="font-bold text-blue-700 text-sm">3. มาตรฐานการบันทึกข้อมูล & ห้ามก๊อปปี้โน้ต</h3>
                <p className="text-xs text-slate-600 leading-relaxed">
                  ตรวจพบการก๊อปปี้โน้ตเก่าซ้ำใน BKK ทีม 1 และ PHS ขาดประวัติสุขภาพ 50% ต้องบันทึกโรคประจำตัวและอาการจริงทุกครั้ง
                </p>
              </div>

              <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-xs space-y-2">
                <h3 className="font-bold text-purple-700 text-sm">4. ซ้อมสคริปต์ตอบคำถามเรื่องของปลอม</h3>
                <p className="text-xs text-slate-600 leading-relaxed">
                  ห้ามบอกว่าบริษัทส่งของปลอมใน TikTok/Shopee แต่ต้องเน้นย้ำความปลอดภัยในการสั่งซื้อตรงกับเจ้าหน้าที่ผู้เชี่ยวชาญของบริษัท
                </p>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
